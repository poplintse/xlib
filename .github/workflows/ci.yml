name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate contract and release manifest
        run: |
          ruby scripts/check-contract.rb
          # Determine the release manifest version to check against. On a push
          # to a release/* branch, prefer that branch name (RELEASE_VERSION is
          # set by the workflow); otherwise fall back to the Android
          # versionName, which is the source of truth for monorepo releases.
          if [ -n "${RELEASE_VERSION:-}" ]; then
            EXPECTED="${RELEASE_VERSION}"
          else
            EXPECTED="$(sed -n 's/^versionName=//p' apps/android/version.properties | head -n1 || true)"
          fi
          if [ -z "${EXPECTED:-}" ]; then
            echo "::warning::No version available; skipping release manifest check."
          elif [ ! -f "releases/${EXPECTED}.yaml" ]; then
            echo "::warning::releases/${EXPECTED}.yaml not found yet; skipping release manifest check."
          else
            ./scripts/release-check.sh "${EXPECTED}"
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:testDebugUnitTest lintDebug :app:assembleDebug
      - name: Verify build did not change version
        run: git diff --exit-code -- version.properties

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test shared Swift package
        run: swift test --package-path packages/apple-shared
      - name: Build iOS
        run: ./scripts/build-ios-debug.sh
      - name: Test iOS
        shell: bash
        run: |
          device_name="$(xcrun simctl list devices available -j | ruby -rjson -e 'data=JSON.parse(STDIN.read); puts data.fetch("devices").values.flatten.find { |d| d["name"].start_with?("iPhone") }.fetch("name")')"
          xcodebuild \
            -project apps/ios/XLibReader.xcodeproj \
            -scheme XLibReader \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${device_name},OS=latest" \
            -derivedDataPath "${RUNNER_TEMP}/xlib-ios-tests" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Verify builds did not change versions
        run: |
          # Info.plist must remain untouched (release operations only).
          git diff --exit-code -- apps/ios/XLibReader/Resources/Info.plist
          # project.pbxproj is allowed to drift only on the Xcode-managed
          # CURRENT_PROJECT_VERSION field (Apple Generic Version System bumps
          # it by 1 per build). Any other change is a leak and must fail.
          # NOTE: use POSIX character classes (BSD grep on macOS runners
          # does not support \s) and swallow grep -v's exit-1 (no matches
          # is the desired success path) so we only fail on actual drift.
          meaningful="$(git diff -- apps/ios/XLibReader.xcodeproj/project.pbxproj \
              | grep -E '^[+-][^+-]' \
              | grep -vE '^(\+|-)[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*[0-9]+[[:space:]]*;' \
              || true)"
          if [ -n "$meaningful" ]; then
            echo "::error::Unexpected changes in project.pbxproj beyond CURRENT_PROJECT_VERSION:"
            echo "$meaningful"
            exit 1
          fi
